[project]
name = "ski-lint"
version = "0.3.2"
description = "A pre-commit hook, that enforces ASCII content."
authors = [{"name" = "Serhii Dimchenko", "email" = "svdimchenko@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"chardet>=5.2.0",
	"omegaconf>=2.3.0",
]

# https://pypi.org/pypi?%3Aaction=list_classifiers
classifiers = [
	"Programming Language :: Python",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Software Development :: Libraries :: Python Modules",
	"Development Status :: 4 - Beta",
]

[project.scripts]
ski-lint = "ski_lint.cli:main"

[project.optional-dependencies]
test = [
	"nox>=2026.4.10,<2027.0.0",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
ruff = ">=0.16.5,<0.17.0"
nox = ">=2026.8.17,<2027.0.0"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "[%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
	# The following rules may cause conflicts when used with the formatter
	"COM812",
	"ISC001",

	# General ignores
	"D107",   # Missing docstring in `__init__`
	"D203",   # one-blank-line-before-class
	"D213",   # multi-line-summary-second-line
	"G004",   # Logging statement uses f-string
]

fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"**/{tests}/*" = [
	"ANN001",  # Missing type annotation for function argument
	"ANN201",  # Missing return type annotation for public function
	"D100",    # Missing docstring in public module
	"D103",    # Missing docstring in public function
	"S101",    # Use of `assert` detected
	"S603",    # `subprocess` call: check for execution of untrusted input
]
"__init__.py" = ["D104"]  # Missing docstring in public package

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
